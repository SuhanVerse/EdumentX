name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Typecheck, lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Zero errors expected: `Documentation/02-Design-System/**` (the
      # extracted Figma reference bundle) is excluded in tsconfig +
      # eslint.config.js.
      - run: npm run typecheck
      - run: npm run lint
      # node:test runner — derived helpers + mock repo behavior.
      - run: npm run test:derived
      # node:test runner — the design-token lint rules themselves, so a
      # regression in eslint-rules/design-tokens.js (e.g. missing a
      # template-literal className) fails CI instead of slipping through.
      - run: npm run test:lint-rules

  rules:
    name: Firestore rules emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Runs the 6 rules suites against the LOCAL emulator with the
      # `demo-edumentx` project — no Firebase credentials needed (the
      # emulator is fully offline). The Java runtime the emulator needs
      # is preinstalled on ubuntu-latest.
      #
      # The deployed-vs-local drift check runs separately in the
      # `rules-deployed` job (it needs real project credentials).
      - run: >
          npx firebase emulators:exec --only firestore --project demo-edumentx
          "node scripts/rulesEmulationTest.mjs && node scripts/batchesRulesTest.mjs
          && node scripts/acceptRequestRulesTest.mjs
          && node scripts/messagesRulesTest.mjs
          && node scripts/reviewsListRulesTest.mjs
          && node scripts/removeEnrollmentRulesTest.mjs"

  # Credentialed drift check: compares the DEPLOYED ruleset (via the
  # Firebase Rules API) against the local firebase/firestore.rules.
  # Requires the `GCP_SA_KEY` repo secret — a Google service-account
  # JSON with the `cloud-platform` scope (see
  # scripts/checkDeployedRules.mjs).
  #
  # Runs on main pushes + manual dispatch only, NOT on PRs: a PR that
  # legitimately changes rules would show drift until the rules are
  # deployed, so this would fail every rules-changing PR by design.
  #
  # IMPORTANT: the `secrets` context is NOT available in ANY `if`
  # condition — not job-level and not step-level. GitHub's context
  # availability table only allows `secrets` inside `env` blocks, and
  # using it in an `if` fails the workflow at PARSE time with
  # "Unrecognized named-value: 'secrets'" (seen twice: job-level and
  # step-level variants). The fix: copy the secret into a JOB-LEVEL
  # `env` variable, then reference `env.GCP_SA_KEY` in the step `if`s.
  # When the secret is unset the env var is the empty string, the
  # `!= ''` checks fail, and the credential steps are skipped — the
  # job passes trivially instead of erroring.
  rules-deployed:
    name: Deployed-rules drift check
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Write service-account key
        if: env.GCP_SA_KEY != ''
        run: |
          echo "$GCP_SA_KEY" > /tmp/gcp-sa-key.json
      - name: Check deployed rules vs local
        if: env.GCP_SA_KEY != ''
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-sa-key.json
        run: npm run test:rules:deployed
