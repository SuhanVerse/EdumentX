name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_checks:
        description: 'Check deployed rules and run live smoke tests that create backend fixtures'
        type: boolean
        required: false
        default: false

jobs:
  check:
    name: Typecheck, lint & unit tests
    runs-on: ubuntu-latest
    steps:
      # v5 of the setup actions runs on Node 24 (v4 targets the
      # deprecated Node 20 runtime — GitHub warns on every run).
      - uses: actions/checkout@v5
      # Use the same audited Node version as local clones (.nvmrc).
      # Node 20 is also deprecated on GitHub runners AND breaks
      # `npm ci` — firebase-tools pulls
      # `@google-cloud/cloud-sql-connector` which requires `>=22`
      # (EBADENGINE failure seen on run #15).
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run requirements:check
      - run: npm run test:requirements
      - run: npm run test:setup
      - run: npm run setup:check
      # Zero errors expected: `Documentation/02-Design-System/**` (the
      # extracted Figma reference bundle) is excluded in tsconfig +
      # eslint.config.js.
      - run: npm run typecheck
      - run: npm run lint
      # node:test runner — derived helpers + mock repo behavior.
      - run: npm run test:derived
      # node:test runner — the design-token lint rules themselves, so a
      # regression in eslint-rules/design-tokens.js (e.g. missing a
      # template-literal className) fails CI instead of slipping through.
      - run: npm run test:lint-rules
      - run: npm run test:discovery
      - run: npm run test:tutor-feed
      - run: npm run test:motion
      - run: npm run test:release-config
      - run: npm run test:auth-recovery
      - run: npm run test:push-lifecycle
      - run: npm run test:push-payload
      - run: npm run test:messages-repository
      - run: npm run test:session-isolation
      - run: npm run test:sandbox
      - run: npm run test:verify-local
      - run: npm --prefix functions ci
      - run: npm --prefix functions run build

  rules:
    name: Firestore rules emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # The Firestore emulator is a Java process. firebase-tools 15.x
      # rejects JDK < 21 ("firebase-tools no longer supports Java
      # version before 21"), and the default JDK on ubuntu-latest is
      # older — run #16 failed exactly there. Pin Temurin 21 to match
      # local dev (java -version → 21.0.11).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      # Runs ALL rules suites against the LOCAL emulator with the
      # `demo-edumentx` project — no Firebase credentials needed (the
      # emulator is fully offline). Invoked via the npm script (not a
      # hardcoded list) so the CI suite list can never drift from
      # `npm run test:rules` again — the Aug 24 audit caught
      # tutorDetailsRulesTest.mjs missing here after it was added to
      # the npm script.
      #
      # The deployed-vs-local drift check runs separately in the
      # `rules-deployed` job (it needs real project credentials).
      - run: >
          npx firebase emulators:exec --only firestore --project demo-edumentx
          "node scripts/rulesEmulationTest.mjs && node scripts/batchesRulesTest.mjs
          && node scripts/acceptRequestRulesTest.mjs
          && node scripts/messagesRulesTest.mjs
          && node scripts/reviewsListRulesTest.mjs
          && node scripts/removeEnrollmentRulesTest.mjs
          && node scripts/tutorDetailsRulesTest.mjs
          && node scripts/userRulesTest.mjs"

  # Credentialed checks: deployed-vs-local drift + LIVE smoke tests.
  # Requires two repo secrets:
  #   - `GCP_SA_KEY` — a Google service-account JSON with the
  #     `cloud-platform` scope (see scripts/checkDeployedRules.mjs).
  #   - `FIREBASE_WEB_API_KEY` — the public Firebase web API key (the
  #     same `EXPO_PUBLIC_FIREBASE_API_KEY` shipped in the app; the
  #     smoke scripts mint real client tokens with it).
  #
  # Explicit manual opt-in only. The live smoke tests mutate real docs
  # (seeded then cleaned up); ordinary repository updates must not do
  # that. Rules-changing source can also legitimately precede deployment.
  #
  # IMPORTANT: the `secrets` context is NOT available in ANY `if`
  # condition — not job-level and not step-level. GitHub's context
  # availability table only allows `secrets` inside `env` blocks, and
  # using it in an `if` fails the workflow at PARSE time with
  # "Unrecognized named-value: 'secrets'" (seen twice: job-level and
  # step-level variants). The fix: copy the secret into a JOB-LEVEL
  # `env` variable, then reference `env.GCP_SA_KEY` in the step `if`s.
  # When a secret is unset the env var is the empty string, the
  # `!= ''` checks fail, and the credential steps are skipped — the
  # job passes trivially instead of erroring.
  rules-deployed:
    name: Deployed-rules drift check + live smoke tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_checks
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Write service-account key
        if: env.GCP_SA_KEY != ''
        run: |
          echo "$GCP_SA_KEY" > /tmp/gcp-sa-key.json
      - name: Check deployed rules vs local
        if: env.GCP_SA_KEY != ''
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-sa-key.json
        run: npm run test:rules:deployed
      # Live end-to-end smoke tests: each suite acts as REAL signed-in
      # clients against the deployed rules (the exact queries/writes
      # the app makes), seeds throwaway data, asserts, then cleans up.
      # Order matters: the drift check above must pass first so a
      # green run proves the CURRENT rules are correct — otherwise the
      # smoke tests would silently exercise a stale deployed ruleset.
      - name: Live smoke tests (enrollments, reviews, batches, messages, tutor-details)
        if: env.GCP_SA_KEY != '' && env.FIREBASE_WEB_API_KEY != ''
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-sa-key.json
        run: |
          npm run smoke:enrollments
          npm run smoke:reviews
          npm run smoke:batches-browse
          npm run smoke:messages
          npm run smoke:tutor-details
